<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>World Map Challenge</title>
  <meta name="description"
    content="Challenge yourself and learn the countries, capitals and flags of the world with interactive maps and spaced repetition.">
  <meta name="author" content="Jan Konstant">
  <link rel="canonical" href="https://map.jankonstant.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="World Map Challenge">
  <meta property="og:url" content="https://map.jankonstant.com/">
  <meta property="og:title" content="World Map Challenge">
  <meta property="og:description"
    content="How many countries of the world can you name? Explore the map, name the countries in any order and see how you score.">
  <meta property="og:image" content="https://map.jankonstant.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="World Map Challenge – a world map with some countries highlighted">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="World Map Challenge">
  <meta name="twitter:description"
    content="How many countries of the world can you name? Explore the map, name the countries in any order and see how you score.">
  <meta name="twitter:image" content="https://map.jankonstant.com/og-image.png">
  <meta name="twitter:image:alt" content="World Map Challenge – a world map with some countries highlighted">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?version=7">
</head>

<body>
  <header>
    <h1><span class="logo" aria-hidden="true">🌍</span><span data-i18n="title">World Map Challenge</span></h1>
    <div class="header-progress">
      <span id="status" role="status" data-i18n="loading">Loading map…</span>
      <button id="evaluate-inline" class="link-button" type="button" hidden data-i18n="evaluate">Evaluate</button>
      <span id="card-progress" hidden></span>
    </div>
    <button id="header-options" class="header-options" type="button" aria-expanded="false"
      aria-controls="header-actions" data-i18n-title="headerOptions">
      <span class="burger-lines" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <div id="header-actions" class="actions">
      <button id="menu-button" data-i18n="mainMenu">Main menu</button>
      <button id="help" type="button" data-i18n="help">How to play</button>
      <button id="reset-deck" data-i18n="resetLearning" hidden>Reset learning</button>
      <button id="evaluate" class="primary" disabled hidden data-i18n="evaluate">Evaluate</button>
      <button id="restart" type="button" hidden data-i18n="restart">Start again</button>
      <button id="reset" class="primary" hidden data-i18n="playAgain">Play again</button>
    </div>
  </header>

  <svg id="map" role="img" aria-label="World map"></svg>

  <p id="notice" role="alert" hidden></p>

  <section id="study-card" aria-labelledby="mode-title" hidden>
    <div class="card-heading">
      <h2 id="mode-title"></h2>
    </div>
    <div id="country-info"></div>
    <p id="card-prompt"></p>
    <form id="card-answer">
      <span class="answer-field">
        <input id="card-guess" type="text" autocomplete="off" autocorrect="off" autocapitalize="words"
          spellcheck="false" required>
        <button type="button" id="clear-answer" class="inline-clear" data-i18n-title="clear" hidden>&times;</button>
      </span>
      <button type="submit" class="primary" data-i18n="checkAnswer">Check answer</button>
    </form>
    <div class="flag-choice-row">
      <div id="flag-options" hidden></div>
      <button type="button" id="clear-flag" class="inline-clear" data-i18n-title="clear" hidden>&times;</button>
    </div>
    <div class="card-result">
      <div id="card-feedback" role="status" aria-live="polite"></div>
      <div class="card-actions">
        <button id="dont-know" type="button" data-i18n="dontKnow" hidden>Don't know</button>
        <button id="too-easy" data-i18n="tooEasy" hidden>Too easy</button>
        <button id="next-card" class="primary" data-i18n="nextCard" hidden>Next card</button>
      </div>
    </div>
  </section>

  <form id="namer" hidden>
    <span class="answer-field">
      <input id="guess" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"
        enterkeyhint="next" data-i18n-placeholder="placeholder">
      <button type="button" id="clear" class="inline-clear" data-i18n-title="clear" hidden>&times;</button>
    </span>
    <button type="submit" class="primary" data-i18n="save">Save</button>
  </form>

  <div id="tooltip" hidden></div>
  <footer>© 2026 Jan Konstant</footer>

  <dialog id="main-menu" class="card" aria-labelledby="menu-title">
    <div class="menu-content">
      <div class="menu-hero">
        <span class="menu-globe" aria-hidden="true">🌍</span>
        <h2 id="menu-title" data-i18n="title">World Map Challenge</h2>
        <p class="lead" data-i18n="menuLead"></p>
      </div>
      <div class="mode-categories">
        <section aria-labelledby="challenges-title">
          <h3 id="challenges-title"><span aria-hidden="true">🏆</span> <span data-i18n="challenges">Challenges</span></h3>
          <button data-mode="challenge-countries" disabled><span class="mode-icon" aria-hidden="true">🗺️</span><span data-i18n="challengeCountries">Name the Countries</span></button>
          <button data-mode="challenge-capitals" disabled><span class="mode-icon" aria-hidden="true">📍</span><span data-i18n="challengeCapitals">Name the Capitals</span></button>
          <button data-mode="challenge-flags" disabled><span class="mode-icon" aria-hidden="true">🚩</span><span data-i18n="challengeFlags">Match the Flag</span></button>
        </section>
        <section aria-labelledby="learn-title">
          <h3 id="learn-title"><span aria-hidden="true">📚</span> <span data-i18n="learn">Learn</span></h3>
          <button data-mode="learn-countries" disabled><span class="mode-icon" aria-hidden="true">🗺️</span><span data-i18n="learnCountries">Country names</span></button>
          <button data-mode="learn-capitals" disabled><span class="mode-icon" aria-hidden="true">📍</span><span data-i18n="learnCapitals">Capitals</span></button>
          <button data-mode="learn-flags" disabled><span class="mode-icon" aria-hidden="true">🚩</span><span data-i18n="learnFlags">Flags</span></button>
        </section>
      </div>
      <p id="menu-status" role="status" data-i18n="loading">Loading map…</p>
      <p id="menu-notice" role="alert" hidden></p>
      <button id="retry-load" data-i18n="retryLoad" hidden>Retry loading</button>
      <div class="menu-language">
        <label for="language" data-i18n="language">Language</label>
        <select id="language" name="language">
          <option value="cs" lang="cs">CZ</option>
          <option value="en" lang="en">EN</option>
          <option value="de" lang="de">DE</option>
        </select>
      </div>
      <p class="menu-copyright">© 2026 Jan Konstant</p>
    </div>
  </dialog>

  <dialog id="intro" class="card">
    <form method="dialog">
      <div class="globe" aria-hidden="true">🌍</div>
      <h2 data-i18n="title">World Map Challenge</h2>
      <p class="lead" data-i18n="introLead"></p>
      <ol id="intro-steps" class="steps"></ol>
      <p class="note" data-i18n="introNote"></p>
      <div class="dialog-actions">
        <button class="primary" autofocus data-i18n="start">Let’s play</button>
      </div>
    </form>
  </dialog>

  <dialog id="result" class="card">
    <form method="dialog">
      <h2 data-i18n="resultTitle">Your result</h2>
      <p id="verdict" class="verdict"></p>
      <div class="big-score" id="score-correct">0</div>
      <p id="score-outof" class="outof"></p>
      <div class="progress">
        <div id="score-bar"></div>
      </div>
      <div class="stats">
        <div class="stat correct"><b id="stat-correct">0</b><span data-i18n="correct">Correct</span></div>
        <div class="stat wrong"><b id="stat-wrong">0</b><span data-i18n="wrong">Wrong</span></div>
        <div class="stat missed"><b id="stat-missed">0</b><span data-i18n="unnamed">Not named</span></div>
      </div>
      <p id="accuracy" class="note"></p>
      <p class="note" data-i18n="explore"></p>
      <div class="dialog-actions">
        <button value="map" data-i18n="showMap">Show map</button>
        <button value="again" class="primary" data-i18n="playAgain">Play again</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script type="module" src="app.js?version=4"></script>
</body>

</html>
