<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>World Map Challenge</title>
  <meta name="description"
    content="How many countries of the world can you name? Explore the map, name the countries in any order and see how you score.">
  <meta name="author" content="Jan Konstant">
  <link rel="canonical" href="https://map.jankonstant.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="World Map Challenge">
  <meta property="og:url" content="https://map.jankonstant.com/">
  <meta property="og:title" content="World Map Challenge">
  <meta property="og:description"
    content="How many countries of the world can you name? Explore the map, name the countries in any order and see how you score.">
  <meta property="og:image" content="https://map.jankonstant.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="World Map Challenge – a world map with some countries highlighted">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="World Map Challenge">
  <meta name="twitter:description"
    content="How many countries of the world can you name? Explore the map, name the countries in any order and see how you score.">
  <meta name="twitter:image" content="https://map.jankonstant.com/og-image.png">
  <meta name="twitter:image:alt" content="World Map Challenge – a world map with some countries highlighted">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?version=1">
</head>

<body>
  <header>
    <h1><span class="logo" aria-hidden="true">🌍</span><span data-i18n="title">World Map Challenge</span></h1>
    <span id="status" data-i18n="loading">Loading map…</span>
    <div class="actions">
      <button id="evaluate" class="primary" disabled data-i18n="evaluate">Evaluate</button>
      <button id="reset" class="primary" hidden data-i18n="playAgain">Play again</button>
    </div>
  </header>

  <svg id="map"></svg>

  <form id="namer" hidden>
    <input id="guess" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"
      enterkeyhint="next" data-i18n-placeholder="placeholder">
    <button type="submit" data-i18n="save">Save</button>
    <button type="button" id="clear" data-i18n="clear">Clear</button>
  </form>

  <div id="tooltip" hidden></div>
  <button id="help" class="icon" data-i18n-title="help" aria-label="How to play">?</button>
  <footer>© 2026 Jan Konstant</footer>

  <dialog id="intro" class="card">
    <form method="dialog">
      <div class="globe" aria-hidden="true">🌍</div>
      <h2 data-i18n="title">World Map Challenge</h2>
      <p class="lead" data-i18n="introLead"></p>
      <ol id="intro-steps" class="steps"></ol>
      <p class="note" data-i18n="introNote"></p>
      <div class="dialog-actions">
        <button class="primary" autofocus data-i18n="start">Let’s play</button>
      </div>
    </form>
  </dialog>

  <dialog id="result" class="card">
    <form method="dialog">
      <h2 data-i18n="resultTitle">Your result</h2>
      <p id="verdict" class="verdict"></p>
      <div class="big-score" id="score-correct">0</div>
      <p id="score-outof" class="outof"></p>
      <div class="progress">
        <div id="score-bar"></div>
      </div>
      <div class="stats">
        <div class="stat correct"><b id="stat-correct">0</b><span data-i18n="correct">Correct</span></div>
        <div class="stat wrong"><b id="stat-wrong">0</b><span data-i18n="wrong">Wrong</span></div>
        <div class="stat missed"><b id="stat-missed">0</b><span data-i18n="unnamed">Not named</span></div>
      </div>
      <p id="accuracy" class="note"></p>
      <p class="note" data-i18n="explore"></p>
      <div class="dialog-actions">
        <button value="map" data-i18n="showMap">Show map</button>
        <button value="again" class="primary" data-i18n="playAgain">Play again</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="i18n.js?version=1"></script>
  <script src="game.js?version=1"></script>
</body>

</html>
